<style>

    --surface-0: #f6f5f2;
    --surface-1: #fcfcfb;
    --surface-2: #f0efec;
    --border:    #e0dfda;
    --border-strong: #c9c8c2;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #7a7975;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-8: #e34948;
    --tag-bg: #eceae5;
    --shadow: 0 4px 14px rgb(0 0 0 / .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #222221;
      --border: #33332f; --border-strong: #4a4a45;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #94938a;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-8: #e66767;
      --tag-bg: #262623; --shadow: 0 4px 14px rgb(0 0 0 / .5);
    }
  }
  :root[data-theme="dark"] {
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #222221;
    --border: #33332f; --border-strong: #4a4a45;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #94938a;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-8: #e66767;
    --tag-bg: #262623; --shadow: 0 4px 14px rgb(0 0 0 / .5);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--surface-0); color: var(--text-primary);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px 96px; }

  h1,h2,h3,h4 { line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 { font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.025em; }
  h2 { font-size: clamp(20px, 2.5vw, 25px); margin-top: 54px; margin-bottom: 8px; }
  h3 { font-size: 17px; }
  p { margin: 0 0 14px; color: var(--text-secondary); }
  a { color: var(--series-1); }
  strong { color: var(--text-primary); font-weight: 620; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88em; }
  em { font-style: italic; }

  /* ---------- top bar, tabs, language switch ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--surface-0) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner { max-width: 1040px; margin: 0 auto; padding: 12px 24px 0; }
  .brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .brand .name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .brand .who { font-size: 12.5px; color: var(--text-muted); }
  .brand .spacer { flex: 1 1 auto; }

  .langsel { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-1); }
  .langsel button {
    appearance: none; border: 0; background: none; cursor: pointer; font: inherit;
    font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: var(--text-muted);
    padding: 3px 9px; border-radius: 5px; line-height: 1.5;
  }
  .langsel button:hover { color: var(--text-primary); }
  .langsel button[aria-pressed="true"] { background: var(--surface-2); color: var(--text-primary); }
  .langsel button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }

  .tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    appearance: none; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 13.5px; font-weight: 550; color: var(--text-secondary);
    padding: 9px 14px 10px; border-bottom: 2px solid transparent; white-space: nowrap;
    display: flex; align-items: center; gap: 8px; border-radius: 6px 6px 0 0;
  }
  .tab:hover { color: var(--text-primary); background: var(--surface-2); }
  .tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--series-1); }
  .tab .cnt {
    font-size: 11px; color: var(--text-muted); background: var(--tag-bg);
    border-radius: 20px; padding: 1px 7px; font-variant-numeric: tabular-nums;
  }
  .tab[aria-selected="true"] .cnt { color: var(--text-secondary); }
  .tab:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }

  .panel[hidden] { display: none; }
  header.hero { padding: 38px 0 26px; border-bottom: 1px solid var(--border); }
  .eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .lede { font-size: 17.5px; max-width: 68ch; margin-top: 14px; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 18px; font-size: 13px; color: var(--text-muted); }
  .section-note { font-size: 14px; color: var(--text-muted); margin: 0 0 22px; max-width: 74ch; }

  /* ---------- tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; margin: 24px 0 8px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 14px; }
  .tile .n { font-size: 29px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .n small { font-size: 15px; font-weight: 550; color: var(--text-secondary); letter-spacing: 0; }
  .tile .k { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; }
  .tile .s { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

  /* ---------- charts ---------- */
  figure { margin: 0 0 12px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  figcaption { font-size: 15px; font-weight: 620; color: var(--text-primary); margin-bottom: 2px; }
  .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .chart-grid { grid-template-columns: 1fr; } }

  .hbars { display: grid; gap: 6px; }
  .hbar { display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 10px; }
  .vlabels .hbar { grid-template-columns: 210px 1fr; }
  .vlabels .yr { font-size: 12.5px; font-weight: 550; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 620px) { .vlabels .hbar { grid-template-columns: 1fr; } .vlabels .yr { margin-bottom: 2px; } }
  .hbar .yr { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .hbar .track { position: relative; height: 20px; display: flex; align-items: center; gap: 8px; }
  .hbar .fill { height: 14px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; }
  .hbar.s2 .fill { background: var(--series-2); }
  .hbar .val { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .axis-note { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  .churn { display: grid; gap: 10px; }
  .churn-row { display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 10px; }
  .churn-row .yr { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .churn-bars { display: grid; gap: 2px; }
  .churn-bar { display: flex; align-items: center; gap: 8px; }
  .churn-bar .f { height: 10px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .churn-bar.add .f { background: var(--series-1); }
  .churn-bar.del .f { background: var(--series-8); }
  .churn-bar .t { font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .cols { display: flex; align-items: flex-end; gap: 2px; height: 150px; border-bottom: 1px solid var(--border-strong); }
  .col { flex: 1 1 0; background: var(--series-1); border-radius: 4px 4px 0 0; min-height: 2px; transition: opacity .12s; }
  .col:hover { opacity: .7; }
  .xaxis { display: flex; gap: 2px; margin-top: 7px; }
  .xtick { flex: 1 1 0; font-size: 11px; color: var(--text-muted); text-align: center; font-variant-numeric: tabular-nums; }
  .peaks { font-size: 11.5px; color: var(--text-muted); margin-top: 12px; }
  .peaks strong { color: var(--text-secondary); font-weight: 600; }
  #tip {
    position: fixed; z-index: 60; pointer-events: none; opacity: 0;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border-strong); border-radius: 7px; padding: 6px 9px;
    font-size: 12.5px; box-shadow: var(--shadow); transition: opacity .1s;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }

  details.tbl { margin: 4px 0 0; }
  details.tbl summary { cursor: pointer; color: var(--text-muted); font-size: 12.5px; padding: 4px 0; }
  .scroll-x { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-secondary); font-weight: 600; }
  .tbl-wrap th, .tbl-wrap td { white-space: normal; vertical-align: top; line-height: 1.5; }
  .tbl-wrap { min-width: 660px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- timeline ---------- */
  .era { position: relative; padding: 0 0 4px 26px; margin-bottom: 26px; border-left: 2px solid var(--border); }
  .era:last-child { border-left-color: transparent; }
  .era::before {
    content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--series-1); border: 2px solid var(--surface-0);
  }
  .era h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
  .era h3 .when { font-size: 12.5px; font-weight: 500; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .era .role { font-size: 13.5px; color: var(--series-1); font-weight: 600; margin: 4px 0 8px; }
  .era ul { margin: 8px 0 10px; padding-left: 18px; }
  .era li { color: var(--text-secondary); margin-bottom: 5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 11.5px; background: var(--tag-bg); color: var(--text-secondary); border-radius: 5px; padding: 3px 8px; }
  .impact { font-size: 13.5px; background: var(--surface-2); border-left: 3px solid var(--series-3); border-radius: 0 7px 7px 0; padding: 9px 13px; margin-top: 10px; color: var(--text-secondary); }
  .impact b { color: var(--text-primary); font-weight: 620; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 20px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .card h3 { font-size: 15.5px; margin-bottom: 8px; }
  .card ul { margin: 0; padding-left: 17px; }
  .card li { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 5px; }
  .card .ev { font-size: 11.5px; color: var(--text-muted); margin-top: 10px; }

  .callout { background: var(--surface-1); border: 1px solid var(--border); border-left: 3px solid var(--series-2); border-radius: 0 10px 10px 0; padding: 16px 18px; margin: 20px 0; }
  .callout h3 { font-size: 15px; margin-bottom: 8px; }
  .callout p:last-child { margin-bottom: 0; }

  footer { margin-top: 60px; padding-top: 22px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
  footer strong { color: var(--text-secondary); }

  @media print {
    body { background: #fff; }
    .topbar { position: static; }
    .tabs, .langsel { display: none; }
    .panel[hidden] { display: block !important; }
    .tile, figure, .card, .era { break-inside: avoid; }
    h2 { break-after: avoid; }
  }
</style>
</head>

let LANG = "en";
let L = I18N.en;
let nf = new Intl.NumberFormat("en-US", { useGrouping: "always" });
let CURRENT_TAB = "global";

const tabsEl = document.getElementById("tablist");
const panelsEl = document.getElementById("panels");
const langEl = document.getElementById("langsel");
const tip = document.getElementById("tip");

const mlabel = k => { const [y,m] = k.split("-"); return L.months[+m-1] + " " + y; };

/* porcentaje legible: nunca redondear a "0 %" algo que no es cero */
function pct(v, total) {
  const p = v / total * 100;
  const sep = LANG === "es" ? "," : ".";
  const space = LANG === "es" ? " %" : "%";
  if (p >= 10) return Math.round(p) + space;
  if (p >= 0.1) return p.toFixed(1).replace(".", sep) + space;
  return (LANG === "es" ? "<0" + sep + "1" : "<0.1") + space;
}

function tiles(list) {
  return `<div class="tiles">` + list.map(t => `
    <div class="tile">
      <div class="n">${t.n}</div>
      <div class="k">${t.k}</div>
      ${t.s ? `<div class="s">${t.s}</div>` : ""}
    </div>`).join("") + `</div>`;
}

function cards(list) {
  return `<div class="cards">` + list.map(c => `
    <div class="card">
      <h3>${c.h}</h3>
      ${c.body ? `<p style="font-size:13.5px;margin:0">${c.body}</p>`
               : `<ul>${c.items.map(i => `<li>${i}</li>`).join("")}</ul>`}
      ${c.ev ? `<div class="ev">${L.ui.evidenceLabel} ${c.ev}</div>` : ""}
    </div>`).join("") + `</div>`;
}

function callouts(list) {
  return list.map(c => `<div class="callout"><h3>${c.h}</h3>${c.ps.map(p => `<p>${p}</p>`).join("")}</div>`).join("");
}

function eras(list, shortLabel) {
  const lbl = shortLabel ? L.ui.impactLabelShort : L.ui.impactLabel;
  return list.map(e => `
    <div class="era">
      <h3>${e.title} <span class="when">${e.when}</span></h3>
      <div class="role">${e.role}</div>
      ${e.repo ? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">${L.ui.projectPrefix} ${e.repo}</div>` : ""}
      <ul>${e.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
      <div class="impact"><b>${lbl}</b> ${e.impact}</div>
      <div class="tags">${e.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
    </div>`).join("");
}

function monthsFigure(key) {
  const t = L[key], n = NUM[key];
  const peaks = [...n.monthly].sort((a,b) => b[1]-a[1]).slice(0,4);
  return `
  <figure>
    <figcaption>${L.ui.figMonths}</figcaption>
    <div class="sub">${t.monthlyNote}</div>
    <div class="cols" data-cols="${key}"></div>
    <div class="xaxis" data-xaxis="${key}"></div>
    <div class="peaks">${L.ui.peaks}: ${peaks.map(([k,v]) => `<strong>${mlabel(k)}: ${v}</strong>`).join(" · ")}</div>
    <details class="tbl">
      <summary>${L.ui.tableToggle}</summary>
      <div class="scroll-x"><table><thead><tr><th>${L.ui.thMonth}</th><th class="num">${L.ui.thCommits}</th></tr></thead>
      <tbody>${n.monthly.map(([k,v]) => `<tr><td>${mlabel(k)}</td><td class="num">${v}</td></tr>`).join("")}</tbody></table></div>
    </details>
  </figure>`;
}

function fillMonths(key, root) {
  const n = NUM[key];
  const cols = root.querySelector(`[data-cols="${key}"]`);
  const xaxis = root.querySelector(`[data-xaxis="${key}"]`);
  if (!cols) return;
  const max = Math.max(...n.monthly.map(d => d[1]));
  n.monthly.forEach(([k,v]) => {
    const el = document.createElement("div");
    el.className = "col";
    // un mes sin commits no debe dibujar barra: 2px se leería como "1 commit"
    if (v === 0) { el.style.height = "0"; el.style.minHeight = "0"; }
    else el.style.height = Math.max(2, (v / max) * 150) + "px";
    el.tabIndex = 0;
    el.setAttribute("role", "img");
    el.setAttribute("aria-label", `${mlabel(k)}: ${v} ${v === 1 ? L.ui.commitSuffix : L.ui.commitsSuffix}`);
    const show = () => {
      tip.textContent = `${mlabel(k)} · ${v} ${v === 1 ? L.ui.commitSuffix : L.ui.commitsSuffix}`;
      tip.style.opacity = 1;
      const r = el.getBoundingClientRect(), tr = tip.getBoundingClientRect();
      let x = r.left + r.width/2 - tr.width/2;
      x = Math.max(8, Math.min(x, window.innerWidth - tr.width - 8));
      tip.style.left = x + "px";
      tip.style.top = Math.max(8, r.top - tr.height - 8) + "px";
    };
    const hide = () => tip.style.opacity = 0;
    el.addEventListener("mouseenter", show); el.addEventListener("focus", show);
    el.addEventListener("mouseleave", hide); el.addEventListener("blur", hide);
    cols.appendChild(el);

    const tk = document.createElement("div");
    tk.className = "xtick";
    tk.textContent = (k.endsWith("-01") || k === n.monthly[0][0]) ? k.slice(0,4) : "";
    xaxis.appendChild(tk);
  });
}

function hbars(yearly, field, cls, partialMonth) {
  const max = Math.max(...yearly.map(d => d[field]));
  return yearly.map(d => `
    <div class="hbar ${cls}">
      <div class="yr">${d.y}${d.partial ? "*" : ""}</div>
      <div class="track">
        <div class="fill" style="width:${max ? (d[field]/max)*82 : 0}%"></div>
        <div class="val">${nf.format(d[field])}</div>
      </div>
    </div>`).join("") + `<div class="axis-note">${L.ui.partialPrefix} ${partialMonth}</div>`;
}

/* barras horizontales genéricas: [{label, value, note}] */
function simpleBars(items) {
  const max = Math.max(...items.map(i => i.value));
  return `<div class="hbars vlabels">` + items.map(i => `
    <div class="hbar">
      <div class="yr" title="${i.label}">${i.label}</div>
      <div class="track">
        <div class="fill" style="width:${(i.value/max)*74}%"></div>
        <div class="val">${nf.format(i.value)}${i.note ? ` <span style="color:var(--text-muted)">· ${i.note}</span>` : ""}</div>
      </div>
    </div>`).join("") + `</div>`;
}

function churnRows(yearly) {
  const max = Math.max(...yearly.flatMap(d => [d.add, d.del]));
  return yearly.map(d => `
    <div class="churn-row">
      <div class="yr">${d.y}</div>
      <div class="churn-bars">
        <div class="churn-bar add"><div class="f" style="width:${(d.add/max)*80}%"></div><div class="t">+${nf.format(d.add)}</div></div>
        <div class="churn-bar del"><div class="f" style="width:${(d.del/max)*80}%"></div><div class="t">−${nf.format(d.del)}</div></div>
      </div>
    </div>`).join("");
}

function yearTable(yearly) {
  return `<details class="tbl"><summary>${L.ui.yearTableToggle}</summary><div class="scroll-x"><table>
    <thead><tr><th>${L.ui.thYear}</th><th class="num">${L.ui.thCommits}</th><th class="num">${L.ui.thPrs}</th><th class="num">${L.ui.thAdded}</th><th class="num">${L.ui.thRemoved}</th></tr></thead>
    <tbody>${yearly.map(d => `<tr><td>${d.y}${d.partial ? " *" : ""}</td><td class="num">${nf.format(d.commits)}</td><td class="num">${d.prs}</td><td class="num">+${nf.format(d.add)}</td><td class="num">−${nf.format(d.del)}</td></tr>`).join("")}</tbody>
  </table></div></details>`;
}

  TABS.forEach(item => {
    const txt = L[item.id];
    const btn = document.createElement("button");
    btn.className = "tab";
    btn.type = "button";
    btn.setAttribute("role", "tab");
    btn.id = `tab-${item.id}`;
    btn.setAttribute("aria-controls", `panel-${item.id}`);
    btn.setAttribute("aria-selected", "false");
    btn.title = txt.hint || "";
    btn.innerHTML = txt.label + (item.count ? ` <span class="cnt">${nf.format(item.count)}</span>` : "");
    btn.addEventListener("click", () => select(item.id, true));
    tabsEl.appendChild(btn);

    const panel = document.createElement("section");
    panel.className = "panel";
    panel.id = `panel-${item.id}`;
    panel.setAttribute("role", "tabpanel");
    panel.setAttribute("aria-labelledby", `tab-${item.id}`);
    panel.hidden = true;
    panel.innerHTML = item.render();
    panelsEl.appendChild(panel);
    if (item.months) fillMonths(item.months, panel);
  });

  select(CURRENT_TAB, false);
}

function select(id, setHash) {
  if (!TABS.some(t => t.id === id)) id = TABS[0].id;
  CURRENT_TAB = id;
  TABS.forEach(item => {
    const on = item.id === id;
    document.getElementById(`tab-${item.id}`).setAttribute("aria-selected", on ? "true" : "false");
    document.getElementById(`panel-${item.id}`).hidden = !on;
  });
  if (setHash) {
    history.replaceState(null, "", "#" + id);
    window.scrollTo({ top: 0, behavior: "auto" });
  }
}

/* teclado: flechas entre pestañas */
tabsEl.addEventListener("keydown", e => {
  const keys = ["ArrowLeft","ArrowRight","Home","End"];
  if (!keys.includes(e.key)) return;
  e.preventDefault();
  const btns = [...tabsEl.querySelectorAll(".tab")];
  const cur = btns.findIndex(b => b.getAttribute("aria-selected") === "true");
  let next = cur;
  if (e.key === "ArrowLeft") next = (cur - 1 + btns.length) % btns.length;
  if (e.key === "ArrowRight") next = (cur + 1) % btns.length;
  if (e.key === "Home") next = 0;
  if (e.key === "End") next = btns.length - 1;
  select(TABS[next].id, true);
  btns[next].focus();
});

/* ---------- idioma ---------- */
const LANG_LABELS = { en: "EN", es: "ES" };
const LANG_TITLES = { en: "English", es: "Español" };

function store(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
function read(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }

function detectLang() {
  const saved = read("portfolio-lang");
  if (saved && I18N[saved]) return saved;
  const q = new URLSearchParams(location.search).get("lang");
  if (q && I18N[q]) return q;
  const navs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
  for (const tag of navs) {
    const base = String(tag).toLowerCase().split("-")[0];
    if (I18N[base]) return base;          // es → español, en → inglés
  }
  return "en";                             // cualquier otro idioma → inglés por defecto
}

function setLang(lang, persist) {
  if (!I18N[lang]) lang = "en";
  LANG = lang;
  L = I18N[lang];
  nf = new Intl.NumberFormat(L.locale, { useGrouping: "always" });
  document.title = L.brandName;
  [...langEl.querySelectorAll("button")].forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });
  if (persist) store("portfolio-lang", lang);
  build();
}

Object.keys(LANG_LABELS).forEach(code => {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.lang = code;
  b.textContent = LANG_LABELS[code];
  b.title = LANG_TITLES[code];
  b.setAttribute("aria-label", LANG_TITLES[code]);
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => setLang(code, true));
  langEl.appendChild(b);
});

const hashTab = location.hash.slice(1);
if (TABS.some(t => t.id === hashTab)) CURRENT_TAB = hashTab;

window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (TABS.some(t => t.id === id)) select(id, false);
});

setLang(detectLang(), false);
</script>
